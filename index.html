<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nickcoin - Bem-vindo</title>
    <style>
        body {
            background-color: #0b0c10;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .phone-container {
            width: 360px;
            height: 740px;
            background-color: #000000;
            border: 4px solid #1f2833;
            border-radius: 36px;
            padding: 20px;
            box-shadow: 0px 0px 25px rgba(0, 255, 204, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-sizing: border-box;
        }
        .logo-xx {
            font-size: 70px;
            font-weight: bold;
            color: #00ffcc;
            border: 3px solid #00ffcc;
            border-radius: 50%;
            width: 120px;
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
            letter-spacing: -5px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
        }
        h1 {
            font-size: 28px;
            letter-spacing: 4px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        h2 {
            font-size: 22px;
            color: #c5c6c7;
            font-weight: 300;
            margin-top: 0;
            margin-bottom: 25px;
        }
        p {
            font-size: 14px;
            color: #66748f;
            line-height: 1.6;
            padding: 0 20px;
            margin-bottom: 40px;
        }
        .btn-entrar {
            background-color: #00ffcc;
            color: #000000;
            border: none;
            padding: 15px 40px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-entrar:hover {
            background-color: #00b38f;
            box-shadow: 0 0 15px #00ffcc;
        }
    </style>
</head>
<body>

    <div class="phone-container">
        <!-- Logótipo X X -->
        <div class="logo-xx">X X</div>
        
        <!-- Títulos -->
        <h1>Nickcoin</h1>
        <h2>Bem-vindo ao Nickcoin</h2>
        
        <!-- Descrição da App -->
        <p>A nova era da moeda digital. Notícias sobre ações mundiais, conversas ao vivo e notificações diárias.</p>
        
        <!-- Botão de Ação -->
        <button class="btn-entrar">Aceder à App</button>
    </div>

</body>
</html>
